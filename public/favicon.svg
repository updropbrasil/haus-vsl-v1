<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Analytics Pulse Line in Background -->
  <path d="M 90 320 L 170 320 L 220 220 L 280 370 L 340 180 L 420 320" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>

  <!-- Glowing Play Button Shape -->
  <g filter="url(#glow)">
    <path d="M 200 156 C 200 142 215 133 227 141 L 358 238 C 369 246 369 263 358 271 L 227 368 C 215 376 200 367 200 353 Z" fill="url(#accentGrad)"/>
    <path d="M 215 178 L 330 255 L 215 332 Z" fill="url(#playGrad)" opacity="0.95"/>
  </g>
</svg>
